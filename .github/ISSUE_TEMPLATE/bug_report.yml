name: Bug report
description: Report reproducible incorrect behavior in LaserPerception.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach dataset samples, secrets, or sensitive security details.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include minimal code, synthetic inputs, and exact commands.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, dependency versions, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, private paths, and licensed dataset content.
          required: true
        - label: This is not a private security vulnerability.
          required: true
