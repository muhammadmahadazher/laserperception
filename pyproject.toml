[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laserperception"
version = "0.2.0"
description = "Reproducible 3D LiDAR detection, raw ROS 2 ingestion, and TensorRT deployment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Mahad Azher" },
]
keywords = [
  "lidar",
  "point-cloud",
  "3d-object-detection",
  "pointpillars",
  "tensorrt",
  "ros2",
  "deployment-engineering",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "laspy>=2.5,<3",
  "numpy>=1.24,<2.3",
]

[project.optional-dependencies]
laz = ["lazrs>=0.6"]
viz = ["matplotlib>=3.8,<4"]
dev = [
  "build>=1.2",
  "matplotlib>=3.8,<4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/muhammadmahadazher/laserperception"
Repository = "https://github.com/muhammadmahadazher/laserperception"
Issues = "https://github.com/muhammadmahadazher/laserperception/issues"
Documentation = "https://github.com/muhammadmahadazher/laserperception/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/laserperception"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/scripts",
  "/ros2",
  "/benchmarks",
  "/docs",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_generics = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["laspy", "laspy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: manual integration tests requiring the pinned CUDA detection environment",
]

[tool.coverage.run]
branch = true
source = ["laserperception"]

[tool.coverage.report]
show_missing = true
skip_covered = true
