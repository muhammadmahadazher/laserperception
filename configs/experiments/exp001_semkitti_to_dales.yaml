experiment:
  id: exp001
  name: semantickitti_to_dales_zero_shot
  status: scaffold
  research_question: >-
    How well does semantic knowledge learned from sparse vehicle-mounted automotive LiDAR
    transfer zero-shot to dense airborne LiDAR under a shared geometry-only semantic label space?

source_dataset:
  name: semantickitti
  root_env: LASERPERCEPTION_SEMANTICKITTI_ROOT

target_dataset:
  name: dales
  root_env: LASERPERCEPTION_DALES_ROOT

task: semantic_segmentation

input_features:
  - x
  - y
  - z

preprocessing:
  coordinate_normalization: min_xyz
  voxel_size_m: 0.30
  normalization_is_explicit: true

ontology:
  name: cvgc_group2_v1
  ignore_id: -1
  classes:
    - Ground
    - Building
    - Natural
    - Vehicle
    - Pole
    - Fence

metrics:
  - mIoU
  - per_class_iou

model:
  status: not_implemented

results:
  status: Pending measurement

provenance:
  cvgc_reference:
    paper: https://arxiv.org/abs/2602.14525
    note: >-
      CVGC settings are reference material only. LaserPerception training patch dimensions,
      backbone, optimizer, and schedule have not been selected.
