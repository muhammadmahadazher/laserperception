  repeatability_indices: [42, 49]
  timing_workloads:
    W0: {sample_index: 0, history: scene_start_zero_historical_sweeps}
    W1: {sample_index: 42, history: ten_historical_sweeps_plus_current_keyframe}
    W2: {sample_index: 49, history: ten_historical_sweeps_plus_current_keyframe}

exact_voxel_gate:
  required_exact_samples: 81
  compare: [voxel_count, shapes, dtypes, values, voxel_order, point_order, zero_padding]
  tensors: [voxels, coors, num_points]
  hash: sha256_contiguous_cpu_bytes
  stop_on_first_mismatch: true

repeatability:
  runs_per_sample: 30
  exact_candidate_input_hashes_required: true
  raw_tensorrt_output_repeatability_recorded_separately: true

detector_fidelity:
  exact_raw_outputs_preferred: true
  exact_final_detections_preferred: true
  reuse_m3b_v1_yardstick_without_changes: true
  exported_detection_threshold: 0.25
  high_confidence_threshold: 0.30
  matching_minimum_bev_iou: 0.50
  minimum_bidirectional_high_confidence_coverage: 0.99
  minimum_per_metric_pass_fraction: 0.99
  maximum_xy_center_displacement_m: 0.25
  maximum_absolute_z_center_difference_m: 0.25
  maximum_relative_error_per_lwh_dimension: 0.05
  maximum_axis_yaw_difference_degrees_modulo_pi: 5.0
  maximum_absolute_score_difference: 0.05
  minimum_heading_direction_agreement: 0.99
  aggregate_maximum_exported_count_relative_difference: 0.005

performance:
  warmups: 20
  measurements: 100
  sustained_gpu_warmup_seconds: 30
  timing: synchronized_time_perf_counter_wall_clock
  telemetry_interval_seconds: 0.5
  telemetry_during_measured_blocks: true
  reject_obvious_reference_candidate_gpu_state_mismatch: true

scope:
  production_candidate_adoption_allowed: false
  deterministic_false_allowed: false
  custom_cuda_allowed: false
  postprocess_optimization_allowed: false
  ros_dds_optimization_allowed: false
  model_change_allowed: false
  engine_rebuild_allowed: false
  onnx_export_allowed: false
  m4_allowed: false
