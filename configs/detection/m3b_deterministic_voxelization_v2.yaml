schema_version: 1
milestone: M3B-V2
status: protocol_frozen_before_measurement
purpose: diagnostic_only_exact_deterministic_fast_voxelization_prototype

reference_source:
  mmcv_version: 2.1.0
  python_wrapper:
    logical_name: mmcv/ops/voxelize.py
    sha256: 745fe000b838cd37bddcd079e73bea854179f6e4057625553c420ff0c2480b58
  pytorch_dispatch:
    logical_name: mmcv/ops/csrc/pytorch/voxelization.cpp
    sha256: ae79f221aea337bac0499422a7ddde594a247598c9bab339bc78edb01f3cea3c
  cuda_launcher:
    logical_name: mmcv/ops/csrc/pytorch/cuda/voxelization_cuda.cu
    sha256: 9a089b79490c1a53648601d992bdacea4f1272af7c127dc0c2ac854ef3f79d2d
  cuda_kernels:
    logical_name: mmcv/ops/csrc/common/cuda/voxelization_cuda_kernel.cuh
    sha256: a161dfcc06303b916cd919b0eb85b3aa3bae33c16730e87c46a0e6db1fd5ab49
  verified_semantics:
    coordinate_convention: z_y_x
    invalid_points_rejected: true
    voxel_order: first_occurrence_in_original_point_order
    point_order_within_voxel: original_input_order
    max_num_points_selection: first_points_in_original_order
    max_voxels_selection: first_new_voxels_in_original_order
    unused_slots: zero_filled

voxelization:
  type: hard
  voxel_size: [0.25, 0.25, 8.0]
  point_cloud_range: [-50.0, -50.0, -5.0, 50.0, 50.0, 3.0]
  max_num_points: 64
  max_voxels_training: 30000
  max_voxels_test: 40000
  reference_deterministic: true

candidate:
  status: experimental_not_production
  coordinate_operation: pinned_mmcv_dynamic_voxel_coordinate_cuda
  implementation: pytorch_tensor_operations
  coordinate_key_order: z_y_x
  grouping_order: composite_voxel_key_then_original_point_index
  stable_sort_required: false
  voxel_order: ascending_first_original_point_index
  point_order_within_voxel: ascending_original_point_index
  custom_cuda: false
  custom_cpp: false
  tensorrt_plugin: false
  deterministic_false_fallback_allowed: false

